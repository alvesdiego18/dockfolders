name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão a publicar (ex.: 0.5). A tag v<versão> será criada."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Normalizar versão
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Build (.app + .dmg)
        run: ./DockFolders/build.sh

      - name: Criar link estável de download
        run: cp DockFolders/dist/DockFolders-${VERSION}.dmg DockFolders/dist/DockFolders.dmg

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            DockFolders/dist/DockFolders-${{ env.VERSION }}.dmg
            DockFolders/dist/DockFolders.dmg
          generate_release_notes: true
